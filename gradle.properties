# Project-wide Gradle settings.
# R8 (minifyEnabled on the release buildType) runs out of heap at 2g on CI:
# "java.lang.OutOfMemoryError: Java heap space" while analysing
# ModernOnboardingScreen.kt. GitHub runners have 7 GB available, so 4g leaves
# headroom for the Kotlin daemon and kapt alongside R8.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
